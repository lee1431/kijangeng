<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>기장엔지니어링 관리자</title><link rel="stylesheet" href="./admin.css"></head><body>
<section id="loginView" class="login-view"><form id="loginForm" class="login-card"><a href="./index.html" class="admin-brand"><img src="./logo.png" alt=""><span>기장엔지니어링</span></a><p class="eyebrow">CONTENT MANAGEMENT</p><h1>관리자 로그인</h1><label>아이디<input name="username" autocomplete="username" required></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label><button class="primary" type="submit">로그인</button><p id="loginMessage" class="message" aria-live="polite"></p></form></section>
<div id="appView" class="admin-app" hidden><aside class="sidebar"><a href="./index.html" class="admin-brand"><img src="./logo.png" alt=""><span>KI-JANG<br><small>ADMIN</small></span></a><nav><button class="nav-button active" data-panel="noticePanel">공지사항</button><button class="nav-button" data-panel="organizationPanel">조직도</button><button class="nav-button" data-panel="performancePanel">주요 실적</button></nav><button id="logoutButton" class="logout">로그아웃</button></aside><main>
<header class="topbar"><div><p class="eyebrow">WEBSITE MANAGEMENT</p><h1 id="pageTitle">공지사항 관리</h1></div><a href="./index.html" target="_blank">홈페이지 보기 ↗</a></header>
<section id="noticePanel" class="panel active"><div class="panel-grid"><form id="noticeForm" class="editor-card"><input type="hidden" name="id"><div class="card-head"><h2>공지 작성</h2><button type="button" class="text-button" data-reset="noticeForm">새 글</button></div><label>제목<input name="title" maxlength="120" required></label><label>게시일<input name="date" type="date" required></label><label>내용<textarea name="content" rows="9" required></textarea></label><label class="check"><input name="published" type="checkbox" checked> 홈페이지에 공개</label><button class="primary" type="submit">저장하기</button></form><div class="list-card"><div class="card-head"><h2>등록된 공지</h2><span id="noticeCount" class="count"></span></div><div id="noticeList" class="record-list"></div></div></div></section>
<section id="organizationPanel" class="panel"><form id="organizationForm" class="editor-card wide"><div class="card-head"><div><h2>조직도 변경</h2><p>새 이미지를 등록하면 회사소개 페이지의 조직도가 교체됩니다.</p></div></div><div class="image-preview"><img id="organizationPreview" src="./ctree3.png" alt="현재 조직도"></div><label class="file-input">조직도 이미지 선택<input name="image" type="file" accept="image/png,image/jpeg,image/webp" required></label><label>대체 텍스트<input name="alt" value="기장엔지니어링 조직도" maxlength="100"></label><button class="primary" type="submit">조직도 적용</button></form></section>
<section id="performancePanel" class="panel"><div class="panel-grid"><form id="performanceForm" class="editor-card"><input type="hidden" name="id"><div class="card-head"><h2>실적 등록</h2><button type="button" class="text-button" data-reset="performanceForm">새 항목</button></div><label>분야<select name="category" required><option value="endd">에너지진단·사용계획</option><option value="tab">T.A.B</option><option value="machine">기계설비 성능점검</option><option value="tunnel">터널 제연설비</option></select></label><label>연도<input name="year" type="number" min="1990" max="2100" required></label><label>제목<input name="title" required maxlength="150"></label><label class="file-input">실적 이미지<input name="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>정렬 순서<input name="sortOrder" type="number" value="0"></label><button class="primary" type="submit">저장하기</button></form><div class="list-card"><div class="card-head"><h2>등록된 실적</h2><select id="performanceFilter"><option value="">전체 분야</option><option value="endd">에너지진단·사용계획</option><option value="tab">T.A.B</option><option value="machine">기계설비</option><option value="tunnel">터널 제연</option></select></div><div id="performanceList" class="record-list"></div></div></div></section><div id="toast" class="toast" role="status"></div></main></div>
<script src="./api.js"></script><script src="./admin.js"></script></body></html>
